name: Deploy Gym TikTok Coach to Pages

on:
  push:
    branches: [master]
    paths:
      - 'tiktok-gym-analyzer/**'
      - '.github/workflows/deploy-gym-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload app folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: tiktok-gym-analyzer
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
